<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Back-office · SDBS</title>
<link rel="icon" type="image/png" href="/assets/logo/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="tri" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- Écran de connexion -->
<main id="login" class="login" hidden>
  <form class="login-card" id="login-form" autocomplete="on">
    <img src="/assets/logo/sdbs-logo.webp" alt="SDBS" width="120" height="120">
    <h1>Espace administrateurs</h1>
    <p class="muted">Connectez-vous pour modifier le site de la SDBS.</p>
    <label for="lg-user">Identifiant</label>
    <input id="lg-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="lg-pass">Mot de passe</label>
    <div class="pass">
      <input id="lg-pass" name="password" type="password" autocomplete="current-password" required>
      <button type="button" class="link" id="lg-show">Afficher</button>
    </div>
    <p class="error" id="lg-error" role="alert" hidden></p>
    <button class="btn primary big" type="submit" id="lg-submit">Se connecter</button>
    <a class="muted small" href="/">← Retour au site</a>
  </form>
</main>

<!-- Application -->
<div id="app" hidden>
  <header class="top">
    <a class="brand" href="/" target="_blank" rel="noopener" title="Voir le site">
      <img src="/assets/logo/sdbs-symbole.webp" alt="" width="36" height="36">
      <span><b>SDBS</b> · Back-office</span>
    </a>
    <span class="status" id="status"></span>
    <div class="top-actions">
      <button class="btn" type="button" id="btn-preview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Aperçu</span>
      </button>
      <button class="btn primary" type="button" id="btn-publish" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        <span>Publier</span>
      </button>
      <details class="menu">
        <summary class="btn ghost" aria-label="Mon compte"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span id="who"></span></summary>
        <div class="menu-pop">
          <a href="/" target="_blank" rel="noopener">Voir le site en ligne</a>
          <button type="button" id="btn-discard">Annuler mes modifications</button>
          <button type="button" id="btn-help">Aide</button>
          <button type="button" id="btn-logout">Se déconnecter</button>
        </div>
      </details>
    </div>
  </header>

  <div class="layout">
    <nav class="side" id="side" aria-label="Sections du site"></nav>
    <label class="side-mobile">
      <span>Partie du site à modifier</span>
      <select id="side-select"></select>
    </label>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>
</div>

<!-- Aperçu -->
<div class="preview" id="preview" hidden>
  <div class="preview-bar">
    <b>Aperçu</b>
    <span class="muted small">Voici le site avec vos modifications. Rien n’est encore publié.</span>
    <div class="seg" role="group" aria-label="Taille d’écran">
      <button type="button" data-w="100%" aria-pressed="true">Ordinateur</button>
      <button type="button" data-w="390px" aria-pressed="false">Téléphone</button>
    </div>
    <div class="seg" role="group" aria-label="Langue">
      <button type="button" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button class="btn" type="button" id="preview-close">Fermer</button>
  </div>
  <div class="preview-stage"><iframe id="preview-frame" title="Aperçu du site"></iframe></div>
</div>

<!-- Fenêtre de dialogue -->
<dialog id="dialog">
  <form method="dialog">
    <h2 id="dlg-title"></h2>
    <div id="dlg-body"></div>
    <div class="dlg-actions">
      <button class="btn" value="cancel" id="dlg-cancel">Annuler</button>
      <button class="btn primary" value="ok" id="dlg-ok">OK</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="/admin/admin.js"></script>
</body>
</html>
