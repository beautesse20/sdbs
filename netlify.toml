# Configuration Netlify (le fichier vercel.json est ignoré par Netlify)
[build]
  command = "node build.js"
  publish = "public"
  # Ne pas reconstruire le site quand seule une photo est envoyée (elle sera incluse à la publication suivante)
  # (un redéploiement manuel ou le premier déploiement ne sont jamais sautés)
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)assets/uploads'"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "SAMEORIGIN"
